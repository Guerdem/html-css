<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: rgb(31, 31, 31);
        }
        .three-dots-svg {
            filter: brightness(0) saturate(100%) invert(93%) sepia(100%) saturate(0%) hue-rotate(341deg) brightness(108%) contrast(108%);
            width: 100%;
        }
        .video-options {
            display: flex;
            align-items: center;
            position: relative;
            width: 50px;
            cursor: pointer;
            transition: opacity 0.5s ease-in-out;
            background-color: rgba(255, 255, 255, 0);
            border-style: none;

        }

        .video-options:active > .background {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
            width: 49px;
            height: 49px;
            opacity: 1;
        }


        .background {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
            background-color: rgb(63, 63, 63);
            border-radius: 8vh;
            width: 50px;
            height: 50px;
            z-index: -2;
            opacity: 0;
            transition: opacity 0ms;

        }

        .border-stroke {
            transition-timing-function: ease-out;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
            border-radius: 8vh;
            border-width: 2px;
            border-color: rgb(63, 63, 63);
            border-style: solid;
            width: 46px;
            height: 46px;
            opacity: 0;
            z-index: -1;
            transition: opacity 1s, border-width 100ms ease-out;

        }

        .video-options:active > .border-stroke {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
            
        }

        .video-options:checked > .border-stroke {
            animation-name: borderExpand;
            animation-duration: 1s;
        }
        

        .more-button {
            width: 50px;
            height: 50px;
            border-radius: 8vh;
            border-style: solid;
            border-color: grey;
            background-color: grey;
            cursor: pointer;
            transition: background-color 0s;
        }

        .more-button:active {
            background-color: rgb(211, 211, 211);
            border-color: rgb(211, 211, 211);

        }

        @keyframes borderExpand {
            0% {

            }

            100% {
                opacity: 1;
                border-width: 3px;
                border-color: red;
            }
        }
    </style>
</head>
<body>
    <button class="video-options">
        <img class="three-dots-svg" src="three dots.svg" alt="">

            <div class="background">

            </div>
            <input  class="border-stroke" type="text">
        </button>

    <button class="more-button">
        <img class="more-button-svg" src="three dots.svg" alt="">
    </button>
</body>
</html>
